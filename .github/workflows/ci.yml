name: Docker CI and Delivery

on:
  push:
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t project-02-docker-ci:test .

      - name: Start test container
        run: docker run -d --name ci-web -p 8080:80 project-02-docker-ci:test

      - name: Check web page
        run: |
          for attempt in {1..10}; do
            if curl -fsS http://localhost:8080/ -o /tmp/page.html; then
              break
            fi
            sleep 2
          done
          grep -q "Docker CI pipeline" /tmp/page.html

      - name: Remove test container
        if: always()
        run: docker rm -f ci-web || true

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ghcr.io/zaidmohd6521-lang/project-02-docker-ci
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag project-02-docker-ci:test "$IMAGE_NAME:$GITHUB_SHA"
          docker tag project-02-docker-ci:test "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"
